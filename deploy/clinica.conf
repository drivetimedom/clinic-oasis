# Hof Circle Gestão (clinic-oasis ejetado do Lovable) — SPA estática servida pelo donna-nginx.
# Colocar em /home/donna/nginx/conf.d/clinica.conf (montado como /etc/nginx/conf.d no container).
# Requer: volume ./clinica/dist -> /usr/share/nginx/clinica no serviço donna-nginx (ver deploy/README.md)
#         e o certificado em /home/donna/nginx/ssl/clinica-fullchain.pem + clinica-privkey.pem.

server {
    listen 80;
    server_name clinica.timedom.com.br;
    # Rota do ACME viva pra emissão/renovação do certificado.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name clinica.timedom.com.br;

    ssl_certificate     /etc/nginx/ssl/clinica-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/clinica-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/clinica;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html (React Router client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome -> cache longo e imutável.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache (pra deploy novo aparecer na hora).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
